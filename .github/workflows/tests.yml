name: "Tests"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  unit:
    name: "Unit tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: "Install requirements"
        run: python3 -m pip install -r requirements.txt

      - name: "Run"
        run: python3 -m unittest discover -s tests/unit -t .

  e2e:
    name: "End-to-end tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements*.txt"

      - name: "Install requirements"
        run: python3 -m pip install -r requirements.txt -r requirements_test.txt

      - name: "Run"
        run: python3 -m unittest discover -s tests/e2e -t .

  frontend:
    name: "Frontend tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "frontend"
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: "Install dependencies"
        run: npm ci

      - name: "Typecheck"
        run: npm run typecheck

      - name: "Run"
        run: npm test

activate_scene:
  target:
    entity:
      integration: magic_lights
      domain: select
  fields:
    scene:
      required: true
      example: relax
      selector:
        text:
    brightness:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    dynamic:
      selector:
        boolean:
    transition:
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          unit_of_measurement: s

turn_off:
  target:
    entity:
      integration: magic_lights
      domain: select
  fields:
    transition:
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          unit_of_measurement: s

toggle_scene:
  target:
    entity:
      integration: magic_lights
      domain: select
  fields:
    scene:
      required: true
      example: relax
      selector:
        text:
    brightness:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    dynamic:
      selector:
        boolean:

next_scene:
  target:
    entity:
      integration: magic_lights
      domain: select
  fields:
    cycle:
      default: true
      selector:
        boolean:

previous_scene:
  target:
    entity:
      integration: magic_lights
      domain: select
  fields:
    cycle:
      default: true
      selector:
        boolean:

adjust_brightness:
  target:
    entity:
      integration: magic_lights
      domain: select
  fields:
    step:
      example: -10
      selector:
        number:
          min: -100
          max: 100
          unit_of_measurement: "%"
    brightness:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

set_dynamic:
  target:
    entity:
      integration: magic_lights
      domain: select
  fields:
    dynamic:
      required: true
      selector:
        boolean:

release:
  target:
    entity:
      integration: magic_lights
      domain: select

reclaim:
  target:
    entity:
      integration: magic_lights
      domain: select
  fields:
    light:
      selector:
        entity:
          domain: light
